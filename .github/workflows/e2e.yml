name: e2e

# Browser tests of AuditKit itself against a throwaway LOCAL Supabase on the
# runner. No secrets are used and no client system is contacted: the app
# talks only to 127.0.0.1, browser requests leaving the machine are blocked,
# and scan targets use the reserved .invalid domain.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: |
          bun install --frozen-lockfile
          # Test-only tool, not an app dependency.
          npm i --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Supabase (applies every migration)
        run: |
          npx -y supabase@2 start -x studio,imgproxy,inbucket,vector,logflare,supavisor,edge-runtime,realtime,postgres-meta
          npx -y supabase@2 status -o env \
            | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' \
            | sed -e 's/^API_URL=/E2E_SUPABASE_URL=/' -e 's/^ANON_KEY=/E2E_SUPABASE_ANON_KEY=/' -e 's/^SERVICE_ROLE_KEY=/E2E_SUPABASE_SERVICE_ROLE_KEY=/' \
            | tr -d '"' >> "$GITHUB_ENV"

      - name: E2E tests
        run: npx playwright test -c e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: npx -y supabase@2 stop --no-backup || true
